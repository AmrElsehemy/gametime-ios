name: GameTimeKit CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test package
        run: swift test
      - name: Build AdMob adapter for iOS
        # `swift test` runs on macOS, where the iOS-only adapter compiles empty, so build it for iOS too.
        run: |
          xcodebuild \
            -scheme GameTimeAdMob \
            -destination "generic/platform=iOS Simulator" \
            build
      - name: Build device feedback for iOS
        # Core Haptics and AVFoundation controllers are iOS-only, so macOS tests do not compile them.
        run: |
          xcodebuild \
            -scheme GameTimeExperience \
            -destination "generic/platform=iOS Simulator" \
            build

